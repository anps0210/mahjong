<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雀 ROOM - 온라인 마작</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
<header>
<div class="brand">雀 <span>ROOM</span></div>
<div class="sub">ONLINE MULTIPLAYER MAHJONG</div>
</header>
<p id="connectionStatus" role="status" aria-live="polite">서버에 연결 중…</p>
<button id="retryConnection" class="hidden">연결 다시 시도</button>

<section id="home" class="panel">
<h1>온라인 마작</h1>
<p class="muted">방을 만들거나 초대 코드를 입력해 참가하세요.</p>
<label>닉네임
<input id="nickname" maxlength="12" placeholder="닉네임" value="플레이어">
</label>
<button id="create" class="primary">방 만들기</button>
<div class="joinrow">
<input id="roomcode" maxlength="5" placeholder="방 코드 (5자리)">
<button id="join">입장</button>
</div>
<p id="homeError" class="error"></p>
</section>

<section id="lobby" class="panel hidden">
<div class="roomhead">
<div><div class="muted">ROOM CODE</div><div id="code" class="code"></div></div>
<button id="copy">코드 복사</button>
</div>
<h2>참가자 <span id="count">0/4</span></h2>
<div id="players" class="players"></div>
<p class="muted">4명이 모이면 방장이 게임을 시작할 수 있어.</p>
<button id="start" class="primary">게임 시작</button>
<p id="lobbyError" class="error"></p>
</section>

<section id="game" class="panel hidden">
<div class="gamehead"><div><span class="eyebrow">PRIVATE TABLE</span><b id="gameCode"></b></div><span id="turnText" class="turn"></span></div>
<div class="mahjong-table">
<div class="table-grain"></div>
<div id="seats" class="seats"></div>
<div id="discards" class="discards"></div>
<div class="tablecenter"><span class="tablelabel">雀 ROOM</span><strong>四人麻雀</strong><span id="wall"></span><span class="center-caption">동 · 남 · 서 · 북</span></div>
</div>
<div class="hand-dock"><div class="hand-heading"><strong>내 손패</strong><span id="handHint">내 차례에 패를 눌러 버리세요</span><label class="sort-control"><input id="sortHand" type="checkbox" checked> 자동 정렬</label></div><div id="hand" class="hand"></div></div>
<p id="gameMessage" class="muted" role="status"></p>
</section>

<footer>Mahjong Room · 실시간 방/턴 동기화 데모</footer>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
